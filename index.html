<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Relevance Evaluation</title>

    <!-- Label Studio Frontend Library -->
    <script src="https://unpkg.com/@heartexlabs/label-studio@1.8.0/build/static/js/main.js"></script>
    <link href="https://unpkg.com/@heartexlabs/label-studio@1.8.0/build/static/css/main.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 20px;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .progress-container {
            background: white;
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            transition: width 0.3s;
        }

        .label-studio-wrapper {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            min-height: 600px;
        }

        #label-studio {
            min-height: 600px;
        }

        /* Custom styling for Label Studio Ranker */
        .htx-ranker-column {
            background: #f8f9fa !important;
            border-radius: 12px !important;
            padding: 15px !important;
            margin: 10px !important;
        }

        .htx-ranker-item {
            background: white !important;
            border: 2px solid #e0e0e0 !important;
            border-radius: 10px !important;
            padding: 12px !important;
            margin-bottom: 10px !important;
            transition: all 0.2s !important;
        }

        .htx-ranker-item:hover {
            border-color: #2196F3 !important;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.2) !important;
        }

        /* Bucket colors */
        [data-bucket="high"] {
            background: #e8f5e9 !important;
            border: 2px solid #4CAF50 !important;
        }

        [data-bucket="medium"] {
            background: #fff3e0 !important;
            border: 2px solid #FF9800 !important;
        }

        [data-bucket="low"] {
            background: #ffebee !important;
            border: 2px solid #f44336 !important;
        }

        .success-screen {
            background: white;
            border-radius: 16px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .success-screen h2 {
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .checkmark {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Recipe Relevance Evaluation</h1>
            <p>Drag recipes into the appropriate relevance bucket: HIGH, MEDIUM, or LOW</p>
        </div>

        <!-- Progress -->
        <div class="progress-container">
            <div class="progress-info">
                <span><strong>Task:</strong> <span id="taskCounter">1 of 2</span></span>
                <span id="sessionId" style="color: #888; font-size: 0.9em;"></span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 50%"></div>
            </div>
        </div>

        <!-- Label Studio Container -->
        <div id="labelStudioWrapper" class="label-studio-wrapper">
            <div id="label-studio"></div>
        </div>

        <!-- Success Screen -->
        <div id="successScreen" class="success-screen hidden">
            <div class="checkmark">✓</div>
            <h2>Thank You!</h2>
            <p style="font-size: 1.2em; color: #666; margin-bottom: 30px;">
                Your categorizations have been saved.<br>
                Your feedback helps improve our recipe recommendations!
            </p>
            <button class="btn btn-primary" onclick="startNew()">Evaluate More Recipes</button>
        </div>
    </div>

    <script>
        // ================================================================
        // CONFIGURATION
        // ================================================================

        const CONFIG = {
            backendUrl: 'http://localhost:5000/api/submit',
            useLocalStorage: true
        };

        // ================================================================
        // LABEL STUDIO CONFIG WITH RANKER + BUCKETS
        // ================================================================

        // This XML config uses the Ranker tag with 3 Buckets for HIGH/MEDIUM/LOW
        const LABELING_CONFIG = `
            <View>
                <Style>
                    .htx-ranker-column {
                        background: #f5f5f5;
                        border-radius: 12px;
                        padding: 15px;
                        min-height: 200px;
                    }
                    .htx-ranker-item {
                        background: white;
                        border: 2px solid #e0e0e0;
                        border-radius: 10px;
                        padding: 12px;
                        margin: 8px 0;
                    }
                    .htx-ranker-item:hover {
                        border-color: #2196F3;
                    }
                </Style>

                <View style="display: flex; gap: 20px; margin-bottom: 20px; padding: 20px; background: #f8f9fa; border-radius: 12px;">
                    <View style="flex-shrink: 0;">
                        <Image name="query_image" value="$image" maxWidth="300px" />
                    </View>
                    <View style="flex: 1;">
                        <Header value="Query Image" size="3"/>
                        <Text name="description" value="$description" />
                        <Header value="Instructions" size="4" style="margin-top: 15px; color: #1976d2;"/>
                        <Text name="instructions" value="Drag each recipe into the appropriate bucket based on how well it matches the ingredients shown." />
                        <View style="margin-top: 10px; padding: 10px; background: #e3f2fd; border-radius: 8px;">
                            <Text name="hint" value="HIGH = Can make well | MEDIUM = Partially make | LOW = Cannot make" />
                        </View>
                    </View>
                </View>

                <Header value="Drag recipes to categorize:" size="3" style="margin-bottom: 15px;"/>

                <List name="recipes" value="$recipes" title="Recipes to Categorize" />

                <Ranker name="relevance" toName="recipes">
                    <Bucket name="high" title="HIGH - Can make well with these ingredients" />
                    <Bucket name="medium" title="MEDIUM - Can partially make, needs a few more" />
                    <Bucket name="low" title="LOW - Cannot make, needs too many ingredients" />
                </Ranker>
            </View>
        `;

        // ================================================================
        // SAMPLE TASKS - Replace with your actual data
        // ================================================================

        const TASKS = [
            {
                id: 1,
                data: {
                    image: "https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=500",
                    description: "Available ingredients: tomatoes, peppers, onions, lettuce, cucumber",
                    recipes: [
                        { id: "101", title: "Greek Salad", body: "Ingredients: tomatoes, cucumber, onion, feta, olives" },
                        { id: "102", title: "Gazpacho", body: "Ingredients: tomatoes, peppers, cucumber, onion, garlic" },
                        { id: "103", title: "Ratatouille", body: "Ingredients: tomatoes, peppers, zucchini, eggplant, onion" },
                        { id: "104", title: "Stuffed Peppers", body: "Ingredients: peppers, rice, ground beef, tomatoes, onion" },
                        { id: "105", title: "Garden Salad", body: "Ingredients: lettuce, tomatoes, cucumber, carrots, dressing" },
                        { id: "106", title: "Bruschetta", body: "Ingredients: tomatoes, basil, garlic, bread, olive oil" },
                        { id: "107", title: "Tomato Soup", body: "Ingredients: tomatoes, onion, cream, basil, garlic" },
                        { id: "108", title: "Veggie Wrap", body: "Ingredients: lettuce, tomatoes, peppers, hummus, tortilla" },
                        { id: "109", title: "Shakshuka", body: "Ingredients: tomatoes, peppers, onion, eggs, spices" },
                        { id: "110", title: "Caesar Salad", body: "Ingredients: lettuce, croutons, parmesan, caesar dressing" }
                    ]
                }
            },
            {
                id: 2,
                data: {
                    image: "https://images.unsplash.com/photo-1587593810167-a84920ea0781?w=500",
                    description: "Available ingredients: chicken breast, eggs, tofu, beans",
                    recipes: [
                        { id: "201", title: "Grilled Chicken", body: "Ingredients: chicken, olive oil, herbs, lemon" },
                        { id: "202", title: "Scrambled Eggs", body: "Ingredients: eggs, butter, salt, pepper" },
                        { id: "203", title: "Tofu Stir Fry", body: "Ingredients: tofu, vegetables, soy sauce, garlic" },
                        { id: "204", title: "Black Bean Tacos", body: "Ingredients: beans, tortillas, salsa, cheese" },
                        { id: "205", title: "Chicken Salad", body: "Ingredients: chicken, mayo, celery, lettuce" },
                        { id: "206", title: "Egg Fried Rice", body: "Ingredients: eggs, rice, vegetables, soy sauce" },
                        { id: "207", title: "Tofu Curry", body: "Ingredients: tofu, coconut milk, curry paste, vegetables" },
                        { id: "208", title: "Bean Soup", body: "Ingredients: beans, onion, garlic, broth, herbs" },
                        { id: "209", title: "Chicken Parmesan", body: "Ingredients: chicken, tomato sauce, mozzarella, breadcrumbs" },
                        { id: "210", title: "Omelette", body: "Ingredients: eggs, cheese, vegetables, butter" }
                    ]
                }
            }
        ];

        // ================================================================
        // STATE
        // ================================================================

        let currentTaskIndex = 0;
        let sessionId = 'ls_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        let labelStudioInstance = null;
        let allSubmissions = [];

        // ================================================================
        // INITIALIZATION
        // ================================================================

        document.addEventListener('DOMContentLoaded', function() {
            console.log("Label Studio Ranker Interface");
            console.log("Session ID:", sessionId);
            document.getElementById('sessionId').textContent = `Session: ${sessionId.substring(0, 20)}...`;

            initializeLabelStudio();
        });

        function initializeLabelStudio() {
            const task = TASKS[currentTaskIndex];

            // Update progress
            updateProgress();

            // Clear previous instance
            const container = document.getElementById('label-studio');
            container.innerHTML = '';

            // Initialize Label Studio with Ranker config
            labelStudioInstance = new LabelStudio('label-studio', {
                config: LABELING_CONFIG,

                interfaces: [
                    "panel",
                    "submit",
                    "skip",
                    "controls"
                ],

                task: {
                    id: task.id,
                    data: task.data
                },

                user: {
                    pk: 1,
                    firstName: "Anonymous",
                    lastName: "User"
                },

                onSubmitAnnotation: function(ls, annotation) {
                    handleSubmission(annotation);
                },

                onSkipTask: function(ls) {
                    console.log("Task skipped");
                    moveToNextTask();
                },

                onLabelStudioLoad: function(ls) {
                    console.log("Label Studio loaded for task", task.id);
                }
            });
        }

        // ================================================================
        // SUBMISSION HANDLING
        // ================================================================

        function handleSubmission(annotation) {
            const task = TASKS[currentTaskIndex];

            // Extract the ranker results from annotation
            const serialized = annotation.serializeAnnotation();

            // The ranker output looks like:
            // { ranker: { high: ["101", "102"], medium: ["103"], low: ["104", "105"], _: [...] } }

            const submission = {
                session_id: sessionId,
                task_id: task.id,
                query_image: task.data.image,
                annotation: serialized,
                timestamp: new Date().toISOString()
            };

            console.log("Annotation submitted:", submission);
            allSubmissions.push(submission);

            // Save to localStorage
            if (CONFIG.useLocalStorage) {
                saveToLocalStorage(submission);
            }

            // Send to backend
            sendToBackend(submission);

            // Move to next task
            moveToNextTask();
        }

        function saveToLocalStorage(data) {
            try {
                const key = 'recipe_relevance_ranker';
                const existing = JSON.parse(localStorage.getItem(key) || '[]');
                existing.push(data);
                localStorage.setItem(key, JSON.stringify(existing));
                console.log("Saved to localStorage. Total:", existing.length);
            } catch (e) {
                console.error("localStorage error:", e);
            }
        }

        async function sendToBackend(data) {
            if (!CONFIG.backendUrl) return;

            try {
                const response = await fetch(CONFIG.backendUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    console.log("Sent to backend successfully");
                } else {
                    console.warn("Backend returned:", response.status);
                }
            } catch (error) {
                console.warn("Backend unavailable:", error.message);
            }
        }

        // ================================================================
        // NAVIGATION
        // ================================================================

        function moveToNextTask() {
            currentTaskIndex++;

            if (currentTaskIndex >= TASKS.length) {
                showSuccessScreen();
            } else {
                initializeLabelStudio();
            }
        }

        function updateProgress() {
            const total = TASKS.length;
            const current = currentTaskIndex + 1;
            const percentage = (current / total) * 100;

            document.getElementById('taskCounter').textContent = `${current} of ${total}`;
            document.getElementById('progressFill').style.width = `${percentage}%`;
        }

        function showSuccessScreen() {
            document.getElementById('labelStudioWrapper').classList.add('hidden');
            document.querySelector('.progress-container').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');

            console.log("All submissions:", allSubmissions);
        }

        function startNew() {
            currentTaskIndex = 0;
            sessionId = 'ls_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            allSubmissions = [];

            document.getElementById('successScreen').classList.add('hidden');
            document.getElementById('labelStudioWrapper').classList.remove('hidden');
            document.querySelector('.progress-container').classList.remove('hidden');

            document.getElementById('sessionId').textContent = `Session: ${sessionId.substring(0, 20)}...`;
            initializeLabelStudio();
        }
    </script>
</body>
</html>
